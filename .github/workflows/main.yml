              </div>
            </main>

            <button id="miniBubble" type="button" class="fixed z-50 hidden w-14 h-14 rounded-full bg-[#102a43]/85 backdrop-blur-md text-white border-2 border-[#7fe1d4] shadow-2xl items-center justify-center text-2xl" style="bottom: 100px; left: 16px; touch-action: none;">🔊</button>

            <div id="floatCard" class="fixed z-50 w-[310px] max-w-[92vw] hidden rounded-2xl bg-[#102a43]/75 backdrop-blur-xl border border-[#7fe1d4]/40 text-white shadow-2xl p-3 space-y-2" style="bottom: 90px; left: 16px;">
              <div id="floatHeader" class="flex items-center justify-between border-b border-white/10 pb-2 cursor-grab" style="touch-action: none;">
                <span class="text-xs font-extrabold text-[#94e2d9]">🔊 اقرأ العائم الشفاف</span>
                <div class="flex items-center gap-1">
                  <button id="minBubbleBtn" type="button" class="px-2 py-0.5 rounded bg-white/15 text-[10px] font-bold">— تصغير</button>
                  <button id="closeFloatBtn" type="button" class="w-6 h-6 rounded-full bg-rose-500/40 text-xs font-bold">✕</button>
                </div>
              </div>

              <div id="floatPreview" class="max-h-16 overflow-y-auto rounded-lg bg-black/30 p-2 text-[11px] leading-relaxed text-[#e4f5f3]"></div>

              <div class="grid grid-cols-3 gap-1.5">
                <button id="readScreenFloatBtn" type="button" class="h-8 rounded-lg bg-[#0f8b8d] text-white font-bold text-[10px]">📺 قراءة الشاشة</button>
                <button id="pasteFloatBtn" type="button" class="h-8 rounded-lg bg-white/15 text-white font-bold text-[10px]">📋 الحافظة</button>
                <button id="playFloatBtn" type="button" class="h-8 rounded-lg bg-emerald-600/80 text-white font-bold text-[10px]">▶ تشغيل</button>
              </div>
            </div>

            <audio id="cloudAudio" class="hidden"></audio>

            <script>
              const $ = id => document.getElementById(id);

              const SAMPLE = "مرحبًا بك في تطبيق اقرأ الشامل (الإصدار 2.4)، والذي سيصبح رفيقك في وقت قريب جدًا. يدعم هذا الإصدار زر قراءة الشاشة للتطبيقات التي تمنع النسخ، مع صوت Charon السحابي وصوت الهاتف الفوري بدون إنترنت.";

              $('mainText').value = SAMPLE;

              let currentMode = 'cloud';
              const proxyBase = 'https://arabic-page-reader-proxy.mahmoudmaroufelsaid.workers.dev';

              function setMode(m) {
                currentMode = m;

                $('btnCloudMode').className =
                  m === 'cloud'
                    ? 'py-2 px-2 rounded-lg text-xs font-bold bg-[#102a43] text-white'
                    : 'py-2 px-2 rounded-lg text-xs font-bold text-[#20364a]';

                $('btnLocalMode').className =
                  m === 'local'
                    ? 'py-2 px-2 rounded-lg text-xs font-bold bg-[#102a43] text-white'
                    : 'py-2 px-2 rounded-lg text-xs font-bold text-[#20364a]';
              }

              $('btnCloudMode').onclick = () => setMode('cloud');
              $('btnLocalMode').onclick = () => setMode('local');

              function fixArabicPronunciation(raw) {
                let t = String(raw || '');

                t = t.replace(
                  /(^|[\s,,.;:؟!«"(\[ـ])(ال)?ق[\u064B-\u0652]*ر[\u064B-\u0652]*ي[\u064B-\u0652]*ب(ا|اً|ة|ه|ها|هم|ك|نا)?(?=$|[\s,,.;:؟!»")\]]))?/gu,
                  (m, pre = '', al = '', suf = '') => {
                    const base = al ? 'القَرِيب' : 'قَرِيب';

                    if (suf === 'ا' || suf === 'اً') return pre + base + 'ًا';
                    if (suf === 'ة') return pre + base + 'َة';

                    return pre + base;
                  }
                );

                t = t
                  .replace(/\[وقفة قصيرة\]/g, '... ')
                  .replace(/\[تنهيدة\]/g, '... هاه ... ')
                  .replace(/\[حماس وتعجب\]/g, ' ! ');

                return t;
              }

              function speakOffline(prepared, rate) {
                if (window.AndroidBridge && typeof window.AndroidBridge.speakAndroidTts === 'function') {
                  window.AndroidBridge.speakAndroidTts(prepared, rate);
                } else if ('speechSynthesis' in window) {
                  window.speechSynthesis.cancel();

                  const u = new SpeechSynthesisUtterance(prepared);
                  u.lang = 'ar-SA';
                  u.rate = rate;

                  window.speechSynthesis.speak(u);
                }
              }

              async function speakNow(text) {
                const prepared = fixArabicPronunciation(text || $('mainText').value);

                if (!prepared.trim()) return;

                $('floatPreview').textContent = prepared;

                const rate = parseFloat($('rateSel').value) || 1.0;

                if (currentMode === 'cloud') {
                  try {
                    $('statusNotice').textContent = '⏳ جارٍ توليد صوت Charon السحابي...';

                    const sRes = await fetch(proxyBase + '/v1/session', {
                      method: 'POST',
                      headers: {
                        'Content-Type': 'application/json'
                      },
                      body: JSON.stringify({
                        clientId: 'iqra-android-app'
                      })
                    });

                    if (!sRes.ok) throw new Error('HTTP ' + sRes.status);

                    const sData = await sRes.json();

                    const tRes = await fetch(proxyBase + '/v1/tts', {
                      method: 'POST',
                      headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + sData.token
                      },
                      body: JSON.stringify({
                        text: prepared.slice(0, 1600),
                        style: 'serious, clear, measured',
                        requestId: String(Date.now())
                      })
                    });

                    if (!tRes.ok) throw new Error('HTTP ' + tRes.status);

                    const result = await tRes.json();

                    const blocks = (result.steps || [])
                      .flatMap(st => Array.isArray(st.content) ? st.content : []);

                    if (result.output_audio) blocks.push(result.output_audio);

                    const block = blocks.find(b => b.data);
                    const audio = $('cloudAudio');

                    audio.src = 'data:audio/wav;base64,' + block.data;
                    audio.playbackRate = rate;

                    await audio.play();

                    $('statusNotice').textContent = '🔊 يقرأ الآن بصوت Charon السحابي';
                    return;
                  } catch (e) {
                    $('statusNotice').textContent = '⚡ تم التحويل الفوري لصوت الهاتف الأوفلاين';
                    setMode('local');
                    speakOffline(prepared, rate);
                  }
                } else {
                  $('statusNotice').textContent = '🔊 يقرأ الآن بصوت الهاتف الفوري (بدون نت)';
                  speakOffline(prepared, rate);
                }
              }

              function handleScreenRead() {
                if (window.AndroidBridge && typeof window.AndroidBridge.isScreenReaderEnabled === 'function') {
                  if (!window.AndroidBridge.isScreenReaderEnabled()) {
                    $('statusNotice').textContent = '⚠️ فعّل «خدمة قراءة الشاشة لتطبيق اقرأ» من الإعدادات أولاً';
                    window.AndroidBridge.openAccessibilitySettings();
                    return;
                  }

                  const captured = window.AndroidBridge.readScreenTextNow();

                  if (captured && captured.trim().length > 2) {
                    $('mainText').value = captured.trim();
                    $('floatCard').classList.remove('hidden');
                    speakNow(captured.trim());
                  } else {
                    $('statusNotice').textContent = 'ℹ️ افتح التطبيق المراد قراءته ثم اضغط قراءة الشاشة من العائم';
                  }
                } else {
                  $('statusNotice').textContent = '📺 ميزة قراءة الشاشة تعمل داخل تطبيق الأندرويد APK';
                }
              }

              $('readScreenMainBtn').onclick = handleScreenRead;
              $('readScreenFloatBtn').onclick = handleScreenRead;

              $('enableAccBtn').onclick = () => {
                if (window.AndroidBridge && window.AndroidBridge.openAccessibilitySettings) {
                  window.AndroidBridge.openAccessibilitySettings();
                }
              };

              $('playMainBtn').onclick = () => speakNow($('mainText').value);
              $('playFloatBtn').onclick = () => speakNow($('mainText').value);

              $('stopMainBtn').onclick = () => {
                $('cloudAudio').pause();

                if (window.AndroidBridge) {
                  window.AndroidBridge.stopAndroidTts();
                }

                if ('speechSynthesis' in window) {
                  window.speechSynthesis.cancel();
                }
              };

              $('pasteBtn').onclick = async () => {
                try {
                  $('mainText').value = await navigator.clipboard.readText();
                } catch (e) {}
              };

              $('pasteFloatBtn').onclick = async () => {
                try {
                  const t = await navigator.clipboard.readText();

                  if (t) {
                    $('mainText').value = t;
                    speakNow(t);
                  }
                } catch (e) {}
              };

              $('cleanLinesBtn').onclick = () => {
                $('mainText').value = $('mainText').value
                  .split(/\n\s*\n+/)
                  .map(p => p.replace(/[\r\n]+/g, ' ').replace(/\s+/g, ' ').trim())
                  .join('\n\n');
              };

              $('clearSpacesBtn').onclick = () => {
                $('mainText').value = $('mainText').value
                  .replace(/\r?\n+/g, ' ')
                  .replace(/\s+/g, ' ')
                  .trim();
              };

              $('addGestureBtn').onclick = () => {
                const g = $('gestureSel').value;
                if (!g) return;

                const ta = $('mainText');
                const s = ta.selectionStart || 0;

                ta.value =
                  ta.value.slice(0, s) +
                  ' ' +
                  g +
                  ' ' +
                  ta.value.slice(ta.selectionEnd || 0);
              };

              $('showFloatBtn').onclick = () => {
                $('floatCard').classList.remove('hidden');
                $('floatPreview').textContent = $('mainText').value;
              };

              $('closeFloatBtn').onclick = () => {
                $('floatCard').classList.add('hidden');
              };

              $('minBubbleBtn').onclick = () => {
                $('floatCard').classList.add('hidden');
                $('miniBubble').classList.remove('hidden');
                $('miniBubble').classList.add('flex');
              };

              $('miniBubble').onclick = () => {
                $('miniBubble').classList.add('hidden');
                $('floatCard').classList.remove('hidden');
              };

              window.receiveFloatingText = function(txt) {
                if (txt) {
                  $('mainText').value = txt;
                  $('floatCard').classList.remove('hidden');
                  speakNow(txt);
                }
              };

              if (window.AndroidBridge && window.AndroidBridge.getInitialText) {
                const initTxt = window.AndroidBridge.getInitialText();

                if (initTxt) {
                  window.receiveFloatingText(initTxt);
                }
              }
            </script>
          </body>
          </html>
          EOF_HTML

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: Iqra-Floating-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
