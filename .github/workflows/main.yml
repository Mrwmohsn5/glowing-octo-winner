          mkdir -p app/src/main/java/com/iqra/floating

          cat << 'EOF_FILE' > app/src/main/java/com/iqra/floating/IqraMediaService.java

          package com.iqra.floating;



          import android.app.Notification;

          import android.app.NotificationChannel;

          import android.app.NotificationManager;

          import android.app.PendingIntent;

          import android.app.Service;

          import android.content.Intent;

          import android.os.Build;

          import android.os.IBinder;

          import android.speech.tts.TextToSpeech;

          import androidx.core.app.NotificationCompat;

          import java.util.Locale;



          public class IqraMediaService extends Service {

              public static final String CHANNEL_ID = "iqra_playback_channel";

              private TextToSpeech tts;

              private boolean isReady = false;



              @Override

              public void onCreate() {

                  super.onCreate();

                  createNotificationChannel();

                  tts = new TextToSpeech(this, status -> {

                      if (status == TextToSpeech.SUCCESS) {

                          tts.setLanguage(new Locale("ar"));

                          isReady = true;

                      }

                  });

              }



              @Override

              public int onStartCommand(Intent intent, int flags, int startId) {

                  String text = intent != null ? intent.getStringExtra("text") : null;

                  if (text == null) text = "اقرأ: جارٍ الاستماع...";



                  Notification notification = buildMediaNotification(text);

                  startForeground(101, notification);



                  if (isReady && intent != null && intent.getBooleanExtra("speak", false)) {

                      tts.speak(text, TextToSpeech.QUEUE_FLUSH, null, "iqra_bg");

                  }

                  return START_NOT_STICKY;

              }



              private Notification buildMediaNotification(String preview) {

                  Intent openIntent = new Intent(this, MainActivity.class);

                  PendingIntent pi = PendingIntent.getActivity(this, 0, openIntent, PendingIntent.FLAG_IMMUTABLE);



                  return new NotificationCompat.Builder(this, CHANNEL_ID)

                          .setContentTitle("اقرأ — مشغّل القراءة الصوتي")

                          .setContentText(preview.length() > 50 ? preview.substring(0, 50) + "..." : preview)

                          .setSmallIcon(R.drawable.ic_launcher)

                          .setContentIntent(pi)

                          .setOngoing(true)

                          .setVisibility(NotificationCompat.VISIBILITY_PUBLIC)

                          .setPriority(NotificationCompat.PRIORITY_LOW)

                          .build();

              }



              private void createNotificationChannel() {

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {

                      NotificationChannel ch = new NotificationChannel(

                              CHANNEL_ID,

                              "مشغّل الصوت في الخلفية",

                              NotificationManager.IMPORTANCE_LOW

                      );

                      ch.setDescription("أزرار التحكم بالصوت في الإشعارات وشاشة القفل");

                      NotificationManager nm = getSystemService(NotificationManager.class);

                      if (nm != null) nm.createNotificationChannel(ch);

                  }

              }



              @Override

              public void onDestroy() {

                  if (tts != null) {

                      tts.stop();

                      tts.shutdown();

                  }

                  super.onDestroy();

              }



              @Override

              public IBinder onBind(Intent intent) {

                  return null;

              }

          }

          EOF_FILE

          mkdir -p app/src/main/java/com/iqra/floating

          cat << 'EOF_FILE' > app/src/main/java/com/iqra/floating/WebViewBridge.java

          package com.iqra.floating;

          

          import android.app.Activity;

          import android.content.Intent;

          import android.speech.tts.TextToSpeech;

          import android.webkit.JavascriptInterface;

          import java.util.Locale;

          

          public class WebViewBridge {

              private final Activity activity;

              private final String initialText;

              private final boolean isFloating;

              private TextToSpeech tts;

              private boolean ttsReady = false;

          

              public WebViewBridge(Activity activity, String initialText, boolean isFloating) {

                  this.activity = activity;

                  this.initialText = initialText != null ? initialText : "";

                  this.isFloating = isFloating;

                  this.tts = new TextToSpeech(activity.getApplicationContext(), status -> {

                      if (status == TextToSpeech.SUCCESS) {

                          int res = tts.setLanguage(new Locale("ar"));

                          ttsReady = (res != TextToSpeech.LANG_MISSING_DATA && res != TextToSpeech.LANG_NOT_SUPPORTED);

                      }

                  });

              }

          

              @JavascriptInterface

              public String getInitialText() {

                  return initialText;

              }

          

              @JavascriptInterface

              public boolean isFloatingWindow() {

                  return isFloating;

              }

          

              @JavascriptInterface

              public void closeFloatingWindow() {

                  activity.runOnUiThread(activity::finish);

              }

          

              @JavascriptInterface

              public void speakAndroidTts(String text, float rate) {

                  if (tts != null && ttsReady) {

                      tts.setSpeechRate(rate > 0 ? rate : 1.0f);

                      tts.speak(text, TextToSpeech.QUEUE_FLUSH, null, "iqra_utt");

                  }

              }

          

              @JavascriptInterface

              public void stopAndroidTts() {

                  if (tts != null) {

                      tts.stop();

                  }

              }

          

              public void shutdown() {

                  if (tts != null) {

                      tts.stop();

                      tts.shutdown();

                  }

              }

          }

          EOF_FILE

          mkdir -p app/src/main/java/com/iqra/floating

          cat << 'EOF_FILE' > app/src/main/java/com/iqra/floating/MainActivity.java

          package com.iqra.floating;

          

          import android.annotation.SuppressLint;

          import android.app.Activity;

          import android.os.Bundle;

          import android.webkit.WebChromeClient;

          import android.webkit.WebSettings;

          import android.webkit.WebView;

          import android.webkit.WebViewClient;

          

          public class MainActivity extends Activity {

              private WebView webView;

              private WebViewBridge bridge;

          

              @SuppressLint("SetJavaScriptEnabled")

              @Override

              protected void onCreate(Bundle savedInstanceState) {

                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);

                  setContentView(webView);

          

                  WebSettings settings = webView.getSettings();

                  settings.setJavaScriptEnabled(true);

                  settings.setDomStorageEnabled(true);

                  settings.setMediaPlaybackRequiresUserGesture(false);

                  settings.setAllowFileAccess(true);

                  settings.setAllowContentAccess(true);

                  settings.setAllowUniversalAccessFromFileURLs(true);

          

                  bridge = new WebViewBridge(this, "", false);

                  webView.addJavascriptInterface(bridge, "AndroidBridge");

                  webView.setWebViewClient(new WebViewClient());

                  webView.setWebChromeClient(new WebChromeClient());

                  webView.loadUrl("file:///android_asset/www/index.html");

              }

          

              @Override

              protected void onDestroy() {

                  if (bridge != null) bridge.shutdown();

                  super.onDestroy();

              }

          }

