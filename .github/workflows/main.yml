          EOF_FILE
          mkdir -p app/src/main/java/com/iqra/floating
          cat << 'EOF_FILE' > app/src/main/java/com/iqra/floating/IqraScreenReaderService.java
          package com.iqra.floating;
          import android.accessibilityservice.AccessibilityService;
          import android.view.accessibility.AccessibilityEvent;
          import android.view.accessibility.AccessibilityNodeInfo;
          import android.view.accessibility.AccessibilityWindowInfo;
          import java.util.List;
          public class IqraScreenReaderService extends AccessibilityService {
              private static IqraScreenReaderService instance;
              private static String lastCapturedScreenText = "";
              @Override
              protected void onServiceConnected() {
                  super.onServiceConnected();
                  instance = this;
              }
              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {
                  try {
                      AccessibilityNodeInfo root = getRootInActiveWindow();
                      if (root != null) {
                          String pkg = root.getPackageName() != null ? root.getPackageName().toString() : "";
                          if (!pkg.contains("com.iqra")) {
                              StringBuilder sb = new StringBuilder();
                              collectNodeText(root, sb);
                              String extracted = sb.toString().trim();
                              if (extracted.length() > 10) {
                                  lastCapturedScreenText = extracted;
                              }
                          }
                      }
                  } catch (Exception ignored) {}
              }
              @Override
              public void onInterrupt() {}
              @Override
              public void onDestroy() {
                  super.onDestroy();
                  if (instance == this) instance = null;
              }
              public static boolean isServiceEnabled() {
                  return instance != null;
              }
              public static String captureCurrentScreenText() {
                  if (instance == null) return lastCapturedScreenText;
                  StringBuilder sb = new StringBuilder();
                  try {
                      List<AccessibilityWindowInfo> windows = instance.getWindows();
                      if (windows != null && !windows.isEmpty()) {
                          for (AccessibilityWindowInfo window : windows) {
                              AccessibilityNodeInfo root = window.getRoot();
                              if (root != null) {
                                  String pkg = root.getPackageName() != null ? root.getPackageName().toString() : "";
                                  if (!pkg.contains("com.iqra")) {
                                      collectNodeText(root, sb);
                                  }
                              }
                          }
                      }
                      if (sb.length() < 10) {
                          AccessibilityNodeInfo activeRoot = instance.getRootInActiveWindow();
                          if (activeRoot != null) {
                              collectNodeText(activeRoot, sb);
                          }
                      }
                  } catch (Exception ignored) {}
                  String res = sb.toString().trim();
                  if (res.length() > 5) {
                      lastCapturedScreenText = res;
                      return res;
                  }
                  return lastCapturedScreenText;
              }
              private static void collectNodeText(AccessibilityNodeInfo node, StringBuilder out) {
                  if (node == null) return;
                  CharSequence text = node.getText();
                  if (text != null && text.length() > 1) {
                      String str = text.toString().trim();
                      if (!str.isEmpty()) {
                          out.append(str).append("\n\n");
                      }
                  }
                  int count = node.getChildCount();
                  for (int i = 0; i < count; i++) {
                      collectNodeText(node.getChild(i), out);
                  }
              }
          }
          EOF_FILE
          cat << 'EOF_FILE' > app/src/main/java/com/iqra/floating/WebViewBridge.java
          package com.iqra.floating;
          import android.app.Activity;
          import android.content.Intent;
          import android.provider.Settings;
          import android.speech.tts.TextToSpeech;
          import android.webkit.JavascriptInterface;
          import java.util.Locale;
          public class WebViewBridge {
              private final Activity activity;
              private final String initialText;
              private final boolean isFloating;
              private TextToSpeech tts;
              private boolean ttsReady = false;
              public WebViewBridge(Activity activity, String initialText, boolean isFloating) {
                  this.activity = activity;
                  this.initialText = initialText != null ? initialText : "";
                  this.isFloating = isFloating;
                  this.tts = new TextToSpeech(activity.getApplicationContext(), status -> {
                      if (status == TextToSpeech.SUCCESS) {
                          int res = tts.setLanguage(new Locale("ar"));
                          ttsReady = (res != TextToSpeech.LANG_MISSING_DATA && res != TextToSpeech.LANG_NOT_SUPPORTED);
                      }
                  });
              }
              @JavascriptInterface
              public String getInitialText() {
                  return initialText;
              }
              @JavascriptInterface
              public boolean isFloatingWindow() {
                  return isFloating;
              }
              @JavascriptInterface
              public void closeFloatingWindow() {
                  activity.runOnUiThread(activity::finish);
              }
              @JavascriptInterface
              public boolean isScreenReaderEnabled() {
                  return IqraScreenReaderService.isServiceEnabled();
              }
              @JavascriptInterface
              public void openAccessibilitySettings() {
                  try {
                      Intent intent = new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS);
                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      activity.startActivity(intent);
                  } catch (Exception ignored) {}
              }
              @JavascriptInterface
              public String readScreenTextNow() {
                  return IqraScreenReaderService.captureCurrentScreenText();
              }
              @JavascriptInterface
              public void speakAndroidTts(String text, float rate) {
                  if (tts != null && ttsReady) {
                      tts.setSpeechRate(rate > 0 ? rate : 1.0f);
                      tts.speak(text, TextToSpeech.QUEUE_FLUSH, null, "iqra_utt");
                  }
              }
              @JavascriptInterface
              public void stopAndroidTts() {
                  if (tts != null) {
                      tts.stop();
                  }
              }
              public void shutdown() {
                  if (tts != null) {
                      tts.stop();
                      tts.shutdown();
                  }
              }
          }
          EOF_FILE
          cat << 'EOF_FILE' > app/src/main/java/com/iqra/floating/MainActivity.java
          package com.iqra.floating;
          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          public class MainActivity extends Activity {
              private WebView webView;
              private WebViewBridge bridge;
              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  setContentView(webView);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setAllowUniversalAccessFromFileURLs(true);
                  bridge = new WebViewBridge(this, "", false);
                  webView.addJavascriptInterface(bridge, "AndroidBridge");
                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());
                  webView.loadUrl("file:///android_asset/www/index.html");
              }
              @Override
              protected void onDestroy() {
                  if (bridge != null) bridge.shutdown();
                  super.onDestroy();
              }
          }
          EOF_FILE
          cat << 'EOF_FILE' > app/src/main/java/com/iqra/floating/FloatingReaderActivity.java
