<audio id="cloudAudio" class="hidden"></audio>
<script>
const $ = id => document.getElementById(id);
const SAMPLE = "مرحبًا بك في تطبيق اقرأ المزدوج، والذي سيصبح رفيقك في وقت قريب جدًا. يعمل التطبيق بصوت Charon السحابي أو بصوت الهاتف الفوري بدون إنترنت.";
$('mainText').value = SAMPLE;
let currentMode = 'cloud';
const proxyBase = 'https://arabic-page-reader-proxy.mahmoudmaroufelsaid.workers.dev';
function setMode(m) {
currentMode = m;
$('btnCloudMode').className = m === 'cloud' ? 'py-2 px-2 rounded-lg text-xs font-bold bg-[#102a43] text-white' : 'py-2 px-2 rounded-lg text-xs font-bold text-[#20364a]';
$('btnLocalMode').className = m === 'local' ? 'py-2 px-2 rounded-lg text-xs font-bold bg-[#102a43] text-white' : 'py-2 px-2 rounded-lg text-xs font-bold text-[#20364a]';
}
('btnCloudMode').onclick = () => setMode('cloud');('btnLocalMode').onclick = () => setMode('local');
function fixArabicPronunciation(raw) {
let t = String(raw || '');
t = t.replace(/(^|[\s،,.;:؟!«"([ـ])(ال)?ق[\u064B-\u0652]*ر[\u064B-\u0652]*ي[\u064B-\u0652]*ب(ا\vert{}اً\vert{}ة\vert{}ه\vert{}ها\vert{}هم\vert{}ك\vert{}نا)?(?=$\vert{}[\s،,.;:؟!»")]]))?/gu, (m, pre = '', al = '', suf = '') => {
const base = al ? 'القَرِيب' : 'قَرِيب';
if (suf === 'ا' || suf === 'اً') return pre + base + 'ًا';
if (suf === 'ة') return pre + base + 'َة';
return pre + base;
});
t = t.replace(/[وقفة قصيرة]/g, '... ').replace(/[تنهيدة]/g, '... هاه ... ').replace(/[حماس وتعجب]/g, ' ! ');
return t;
}
function speakOffline(prepared, rate) {
if (window.AndroidBridge && typeof window.AndroidBridge.speakAndroidTts === 'function') {
window.AndroidBridge.speakAndroidTts(prepared, rate);
} else if ('speechSynthesis' in window) {
window.speechSynthesis.cancel();
const u = new SpeechSynthesisUtterance(prepared);
u.lang = 'ar-SA';
u.rate = rate;
window.speechSynthesis.speak(u);
}
}
async function speakNow(text) {
const prepared = fixArabicPronunciation(text || $('mainText').value);
if (!prepared.trim()) return;
('floatPreview').textContent = prepared;
const rate = parseFloat(('rateSel').value) || 1.0;
if (currentMode === 'cloud') {
try {
$('statusNotice').textContent = '⏳ جارٍ توليد صوت Charon السحابي...';
const sRes = await fetch(proxyBase + '/v1/session', {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({ clientId: 'iqra-android-app' })
});
if (!sRes.ok) throw new Error('HTTP ' + sRes.status);
const sData = await sRes.json();
const tRes = await fetch(proxyBase + '/v1/tts', {
method: 'POST',
headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + sData.token },
body: JSON.stringify({ text: prepared.slice(0, 1600), style: 'serious, clear, measured', requestId: String(Date.now()) })
});
if (!tRes.ok) throw new Error('HTTP ' + tRes.status);
const result = await tRes.json();
const blocks = (result.steps || []).flatMap(st => Array.isArray(st.content) ? st.content : []);
if (result.output_audio) blocks.push(result.output_audio);
const block = blocks.find(b => b.data);
const audio = $('cloudAudio');
audio.src = 'data:audio/wav;base64,' + block.data;
audio.playbackRate = rate;
await audio.play();
$('statusNotice').textContent = '🔊 يقرأ الآن بصوت Charon السحابي';
return;
} catch (e) {
$('statusNotice').textContent = '⚡ تم التحويل الفوري لصوت الهاتف الأوفلاين';
setMode('local');
speakOffline(prepared, rate);
}
} else {
$('statusNotice').textContent = '🔊 يقرأ الآن بصوت الهاتف الفوري (بدون نت)';
speakOffline(prepared, rate);
}
}
('playMainBtn').onclick = () => speakNow(('mainText').value);
('playFloatBtn').onclick = () => speakNow(('mainText').value);
('stopMainBtn').onclick = () => {(
