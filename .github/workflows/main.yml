name: Build Iqra Floating APK



on:

  push:

  workflow_dispatch:



jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Generate Android Project Files

        run: |

          cat << 'EOF_FILE' > settings.gradle

          pluginManagement {

              repositories {

                  google()

                  mavenCentral()

                  gradlePluginPortal()

              }

          }

          dependencyResolutionManagement {

              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {

                  google()

                  mavenCentral()

              }

          }

          rootProject.name = "IqraFloatingReader"

          include ':app'

          EOF_FILE

          cat << 'EOF_FILE' > build.gradle

          plugins {

              id 'com.android.application' version '8.2.2' apply false

          }

          EOF_FILE

          cat << 'EOF_FILE' > gradle.properties

          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

          android.useAndroidX=true

          EOF_FILE

          mkdir -p app

          cat << 'EOF_FILE' > app/build.gradle

          plugins {

              id 'com.android.application'

          }

          

          android {

              namespace 'com.iqra.floating'

              compileSdk 34

          

              defaultConfig {

                  applicationId "com.iqra.floating"

                  minSdk 23

                  targetSdk 34

                  versionCode 150

                  versionName "1.5.0"

