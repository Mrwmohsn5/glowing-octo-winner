name: Build Iqra Floating APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Complete Android Project Files (v2.4 Full Screen Reader + Custom Signed)
        run: |
          cat << 'EOF_FILE' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "IqraFloatingReader"
          include ':app'
          EOF_FILE

          cat << 'EOF_FILE' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF_FILE

          cat << 'EOF_FILE' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF_FILE

          mkdir -p app
          keytool -genkey -v -keystore app/iqra-release.keystore -alias iqra_key -keyalg RSA -keysize 2048 -validity 10000 -storepass iqra123456 -keypass iqra123456 -dname "CN=Iqra Reader, OU=Mobile, O=Iqra, L=Cairo, S=Cairo, C=EG"

          cat << 'EOF_FILE' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.iqra.floating'
              compileSdk 34

              defaultConfig {
                  applicationId "com.iqra.reader.custom"
                  minSdk 23
                  targetSdk 34
                  versionCode 240
                  versionName "2.4.0"
              }

              signingConfigs {
                  releaseConfig {
                      storeFile file("iqra-release.keystore")
                      storePassword "iqra123456"
                      keyAlias "iqra_key"
                      keyPassword "iqra123456"
                      v1SigningEnabled true
                      v2SigningEnabled true
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.releaseConfig
                  }
                  debug {
                      signingConfig signingConfigs.releaseConfig
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.core:core:1.12.0'
              implementation 'androidx.media:media:1.7.0'
          }
          EOF_FILE

          mkdir -p app/src/main/res/values
          cat << 'EOF_FILE' > app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">اقرأ</string>
              <string name="process_text_label">اقرأ لي 🔊</string>
              <string name="accessibility_service_label">خدمة قراءة الشاشة لتطبيق اقرأ</string>
              <string name="accessibility_service_description">تتيح لتطبيق اقرأ قراءة النصوص العربية الظاهرة على الشاشة داخل التطبيقات التي تمنع النسخ المباشر.</string>
          </resources>
          EOF_FILE

          cat << 'EOF_FILE' > app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="FloatingDialogTheme" parent="@android:style/Theme.DeviceDefault.Light.Dialog.NoActionBar">
                  <item name="android:windowIsFloating">true</item>
                  <item name="android:windowIsTranslucent">true</item>
                  <item name="android:windowBackground">@android:color/transparent</item>
                  <item name="android:backgroundDimEnabled">false</item>
                  <item name="android:windowNoTitle">true</item>
              </style>
              <style name="MainAppTheme" parent="@android:style/Theme.DeviceDefault.Light.NoActionBar">
                  <item name="android:statusBarColor">#102A43</item>
              </style>
          </resources>
          EOF_FILE

          mkdir -p app/src/main/res/xml
          cat << 'EOF_FILE' > app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:description="@string/accessibility_service_description"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFlags="flagDefault|flagRetrieveInteractiveWindows"
              android:accessibilityFeedbackType="feedbackSpoken"
              android:notificationTimeout="100"
              android:canRetrieveWindowContent="true" />
          EOF_FILE

          mkdir -p app/src/main/res/drawable
          cat << 'EOF_FILE' > app/src/main/res/drawable/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
