            <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
            <script src="https://cdn.tailwindcss.com/3.4.17"></script>
            <style>
              body { font-family: 'Cairo', Tahoma, sans-serif; background: #f4f8f9; color: #20364a; margin: 0; }
              .active-chunk-card { border-color: #0f8b8d !important; background-color: #e4f5f3 !important; }
            </style>
          </head>
          <body class="min-h-screen flex flex-col pb-20">
            <header class="sticky top-0 z-30 bg-[#102a43] text-white shadow-md px-4 py-3 flex items-center justify-between">
              <div class="flex items-center gap-2">
                <h1 class="font-extrabold text-lg">اقرأ</h1>
                <span class="text-[11px] bg-[#0f8b8d]/40 text-[#94e2d9] px-2 py-0.5 rounded-full font-bold">الإصدار 2.2 المحدث</span>
              </div>
              <span class="text-[11px] px-2.5 py-1 rounded-full bg-emerald-500/20 text-emerald-300 font-bold">أوفلاين بدون نت 100%</span>
            </header>

            <main class="max-w-xl w-full mx-auto px-3.5 pt-4 space-y-4">
              <div class="rounded-2xl bg-gradient-to-br from-[#102a43] to-[#1d5370] text-white p-4 shadow-md space-y-3">
                <div class="flex items-center justify-between">
                  <h2 class="text-sm font-extrabold">القارئ العربي الذكي والنافذة العائمة الشفافة</h2>
                  <button id="showFloatBtn" type="button" class="px-3 py-1.5 rounded-lg bg-[#94e2d9] text-[#102a43] font-extrabold text-xs">إظهار النافذة العائمة 🔊</button>
                </div>
                <div class="grid grid-cols-2 gap-2">
                  <button id="pasteBtn" type="button" class="py-2 rounded-xl bg-white/15 font-bold text-xs">📋 لصق الحافظة</button>
                  <button id="sampleBtn" type="button" class="py-2 rounded-xl bg-white/15 font-bold text-xs">📖 نص تجريبي</button>
                </div>
              </div>

              <div class="rounded-2xl bg-white border border-[#d8e4e9] p-3.5 shadow-sm space-y-3">
                <div class="flex flex-wrap items-center justify-between gap-2 p-2 rounded-xl bg-[#f4f8f9] border border-[#d8e4e9]">
                  <div class="flex items-center gap-1.5">
                    <button id="cleanLinesBtn" type="button" class="h-8 px-2.5 rounded-lg bg-white border border-[#d8e4e9] text-[#102a43] font-bold text-xs">🧹 دمج وضغط السطور</button>
                    <button id="clearSpacesBtn" type="button" class="h-8 px-2 rounded-lg bg-white border border-[#d8e4e9] text-[#6d8190] font-bold text-xs">مسح الفراغات</button>
                  </div>
                  <div class="flex items-center gap-1">
                    <select id="gestureSel" class="h-8 px-2 rounded-lg border border-[#d8e4e9] bg-white text-xs font-bold">
                      <option value="">🎭 اختر إيماءة...</option>
                      <option value="[وقفة قصيرة]">⏱ [وقفة قصيرة]</option>
                      <option value="[تنهيدة]">💨 [تنهيدة]</option>
                      <option value="[همس هادئ]">🤫 [همس هادئ]</option>
                      <option value="[حماس وتعجب]">🔥 [حماس وتعجب]</option>
                      <option value="[تأكيد وحزم]">💪 [تأكيد وحزم]</option>
                      <option value="[استفهام وتساؤل]">❓ [استفهام وتساؤل]</option>
                    </select>
                    <button id="addGestureBtn" type="button" class="h-8 px-2.5 rounded-lg bg-[#0f8b8d] text-white font-bold text-xs">+ إدراج</button>
                  </div>
                </div>

                <textarea id="mainText" rows="6" class="w-full rounded-xl border border-[#d8e4e9] p-3 text-sm leading-relaxed"></textarea>

                <div class="p-2 rounded-xl bg-[#e4f5f3] text-[#076b70] text-xs font-bold flex items-center justify-between">
                  <span>✅ تم تصحيح نطق كلمة «قَرِيب / قَرِيبًا / القَرِيب» تلقائيًا</span>
                  <select id="rateSel" class="h-8 px-2 rounded-lg border border-[#0f8b8d]/30 bg-white text-xs font-bold">
                    <option value="0.75">0.75x</option>
                    <option value="1" selected>1.0x</option>
                    <option value="1.25">1.25x</option>
                    <option value="1.5">1.5x</option>
                  </select>
                </div>

                <div class="flex gap-2">
                  <button id="playMainBtn" type="button" class="flex-1 h-12 rounded-xl bg-[#0f8b8d] text-white font-extrabold text-sm">▶ تشغيل فوري بصوت الهاتف (بدون نت)</button>
                  <button id="stopMainBtn" type="button" class="h-12 px-4 rounded-xl bg-rose-50 border border-rose-200 text-[#b64545] font-bold text-xs">■ إيقاف</button>
                </div>
              </div>
            </main>

            <button id="miniBubble" type="button" class="fixed z-50 hidden w-14 h-14 rounded-full bg-[#102a43]/85 backdrop-blur-md text-white border-2 border-[#7fe1d4] shadow-2xl items-center justify-center text-2xl" style="bottom: 100px; left: 16px; touch-action: none;">🔊</button>

            <div id="floatCard" class="fixed z-50 w-[300px] max-w-[90vw] hidden rounded-2xl bg-[#102a43]/75 backdrop-blur-xl border border-[#7fe1d4]/40 text-white shadow-2xl p-3 space-y-2" style="bottom: 90px; left: 16px;">
              <div id="floatHeader" class="flex items-center justify-between border-b border-white/10 pb-2 cursor-grab" style="touch-action: none;">
                <span class="text-xs font-extrabold text-[#94e2d9]">🔊 اقرأ العائم الشفاف (اسحبني)</span>
                <div class="flex items-center gap-1">
                  <button id="minBubbleBtn" type="button" class="px-2 py-0.5 rounded bg-white/15 text-[10px] font-bold">— تصغير</button>
                  <button id="closeFloatBtn" type="button" class="w-6 h-6 rounded-full bg-rose-500/40 text-xs font-bold">✕</button>
                </div>
              </div>
              <div id="floatPreview" class="max-h-16 overflow-y-auto rounded-lg bg-black/30 p-2 text-[11px] leading-relaxed text-[#e4f5f3]"></div>
              <div class="grid grid-cols-2 gap-1.5">
                <button id="readScreenBtn" type="button" class="h-8 rounded-lg bg-[#0f8b8d] text-white font-bold text-[10px]">📺 قراءة الشاشة</button>
                <button id="playFloatBtn" type="button" class="h-8 rounded-lg bg-white/15 text-white font-bold text-[10px]">▶ تشغيل / إيقاف</button>
              </div>
            </div>

            <script>
              const $ = id => document.getElementById(id);
              const SAMPLE = "مرحبًا بك في تطبيق اقرأ المحدّث، والذي سيصبح رفيقك في وقت قريب جدًا. تم ضبط نطق كلمة قريب وقريبًا وفي القريب العاجل بالتشكيل الصحيح.";
              $('mainText').value = SAMPLE;

              function fixArabicPronunciation(raw) {
                let t = String(raw || '');
                t = t.replace(/(^|[\s،,.;:؟!«"(\[ـ])(ال)?ق[\u064B-\u0652]*ر[\u064B-\u0652]*ي[\u064B-\u0652]*ب(ا|اً|ة|ه|ها|هم|ك|نا)?(?=$|[\s،,.;:؟!»")\]]))?/gu, (m, pre = '', al = '', suf = '') => {
                  const base = al ? 'القَرِيب' : 'قَرِيب';
                  if (suf === 'ا' || suf === 'اً') return pre + base + 'ًا';
                  if (suf === 'ة') return pre + base + 'َة';
                  return pre + base;
                });
                t = t.replace(/\[وقفة قصيرة\]/g, '... ').replace(/\[تنهيدة\]/g, '... هاه ... ').replace(/\[حماس وتعجب\]/g, ' ! ');
                return t;
              }

              function speakNow(text) {
                const prepared = fixArabicPronunciation(text || $('mainText').value);
                if (!prepared.trim()) return;
                $('floatPreview').textContent = prepared;
                const rate = parseFloat($('rateSel').value) || 1.0;
                if (window.AndroidBridge && typeof window.AndroidBridge.speakAndroidTts === 'function') {
                  window.AndroidBridge.speakAndroidTts(prepared, rate);
                } else if ('speechSynthesis' in window) {
                  window.speechSynthesis.cancel();
                  const u = new SpeechSynthesisUtterance(prepared);
                  u.lang = 'ar-SA';
                  u.rate = rate;
                  window.speechSynthesis.speak(u);
                }
              }

              $('playMainBtn').onclick = () => speakNow($('mainText').value);
              $('playFloatBtn').onclick = () => speakNow($('mainText').value);
              $('stopMainBtn').onclick = () => {
                if (window.AndroidBridge) window.AndroidBridge.stopAndroidTts();
                if ('speechSynthesis' in window) window.speechSynthesis.cancel();
              };
              $('sampleBtn').onclick = () => { $('mainText').value = SAMPLE; };
              $('pasteBtn').onclick = async () => {
                try { $('mainText').value = await navigator.clipboard.readText(); } catch(e){}
              };
              $('cleanLinesBtn').onclick = () => {
                $('mainText').value = $('mainText').value.split(/\n\s*\n+/).map(p => p.replace(/[\r\n]+/g, ' ').replace(/\s+/g, ' ').trim()).join('\n\n');
              };
              $('clearSpacesBtn').onclick = () => {
                $('mainText').value = $('mainText').value.replace(/\r?\n+/g, ' ').replace(/\s+/g, ' ').trim();
              };
              $('addGestureBtn').onclick = () => {
                const g = $('gestureSel').value;
                if (!g) return;
                const ta = $('mainText');
                const s = ta.selectionStart || 0;
                ta.value = ta.value.slice(0, s) + ' ' + g + ' ' + ta.value.slice(ta.selectionEnd || 0);
              };
              $('showFloatBtn').onclick = () => { $('floatCard').classList.remove('hidden'); $('floatPreview').textContent = $('mainText').value; };
              $('closeFloatBtn').onclick = () => { $('floatCard').classList.add('hidden'); };
              $('minBubbleBtn').onclick = () => { $('floatCard').classList.add('hidden'); $('miniBubble').classList.remove('hidden'); $('miniBubble').classList.add('flex'); };
              $('miniBubble').onclick = () => { $('miniBubble').classList.add('hidden'); $('floatCard').classList.remove('hidden'); };
              $('readScreenBtn').onclick = () => {
                if (window.AndroidBridge && window.AndroidBridge.readScreenText) {
                  const st = window.AndroidBridge.readScreenText();
                  if (st) { $('mainText').value = st; speakNow(st); }
                }
              };

              window.receiveFloatingText = function(txt) {
                if (txt) {
                  $('mainText').value = txt;
                  $('floatCard').classList.remove('hidden');
                  speakNow(txt);
                }
              };

              if (window.AndroidBridge && window.AndroidBridge.getInitialText) {
                const initTxt = window.AndroidBridge.getInitialText();
                if (initTxt) window.receiveFloatingText(initTxt);
              }
            </script>
          </body>
          </html>
