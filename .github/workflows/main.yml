                  android:fillColor="#102A43"
                  android:pathData="M0,0h40v40h-40z"/>
              <path
                  android:strokeColor="#85D7CF"
                  android:strokeWidth="2.5"
                  android:pathData="M8,9.5A4.5,4.5 0,0 1,12.5 5H20v25h-7.5A4.5,4.5 0,0 0,8 34.5v-25Z"/>
              <path
                  android:strokeColor="#85D7CF"
                  android:strokeWidth="2.5"
                  android:pathData="M32,9.5A4.5,4.5 0,0 0,27.5 5H20v25h7.5a4.5,4.5 0,0 1,4.5 4.5v-25Z"/>
          </vector>
          EOF_FILE

          cat << 'EOF_FILE' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/MainAppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".FloatingReaderActivity"
                      android:label="@string/process_text_label"
                      android:theme="@style/FloatingDialogTheme"
                      android:excludeFromRecents="true"
                      android:taskAffinity=""
                      android:launchMode="singleInstance"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:exported="true">
                      <intent-filter android:label="@string/process_text_label">
                          <action android:name="android.intent.action.PROCESS_TEXT" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="text/plain" />
                      </intent-filter>
                      <intent-filter android:label="@string/process_text_label">
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="text/plain" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".IqraScreenReaderService"
                      android:label="@string/accessibility_service_label"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
